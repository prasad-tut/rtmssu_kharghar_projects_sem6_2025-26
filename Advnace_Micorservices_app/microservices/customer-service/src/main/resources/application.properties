# Application Configuration
spring.application.name=customer-service
server.port=${PORT:9103}

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Tuning for Cloud (Strict Free Tier)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:2}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${jpa.ddl-auto:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Service URLs
user.service.url=${USER_SERVICE_URL:http://localhost:9101}
ticket.service.url=${TICKET_SERVICE_URL:http://localhost:9102}

# Actuator
management.endpoints.web.exposure.include=health,info

# Logging
logging.level.mssu.in.customer_service=DEBUG
