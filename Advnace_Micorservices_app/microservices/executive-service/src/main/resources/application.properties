# Executive Service Configuration
server.port=${PORT:9105}

# Application Name
spring.application.name=executive-service

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Tuning for Cloud
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${jpa.ddl-auto:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.mssu.in.executive_service=DEBUG
logging.level.org.springframework.web=INFO

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Service URLs for inter-service communication
user.service.url=${USER_SERVICE_URL:http://localhost:9101}
ticket.service.url=${TICKET_SERVICE_URL:http://localhost:9102}
customer.service.url=${CUSTOMER_SERVICE_URL:http://localhost:9103}
admin.service.url=${ADMIN_SERVICE_URL:http://localhost:9104}

# AI API (OpenRouter)
ai.api.key=${AI_API_KEY}
ai.model=${AI_MODEL:meta-llama/llama-3.3-70b-instruct:free}

# RestTemplate Timeouts (increased for Gemini API calls)
rest.template.connect-timeout=30000
rest.template.read-timeout=30000
